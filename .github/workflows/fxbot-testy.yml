# Isolated tests on every push and pull request (R-050): python fxbot.py test (temporary database, never data/).
name: FXBOT testy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-provoz.txt
      - run: pip install -r requirements-provoz.txt
      - run: python fxbot.py test
