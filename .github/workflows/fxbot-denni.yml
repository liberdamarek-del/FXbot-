# FXBOT on GitHub Actions (R-050 / R-051, docs/GITHUB_PROVOZ.md): the daily update after the New York close, the Friday
# signals and - in the "ostry" mode only - an hourly refresh on weekdays; then the public page on GitHub Pages.
# Mirrors the Claude routines "denní aktualizace" and "páteční signály".
#
# Cron is UTC and GitHub may start scheduled runs late or drop them under load, so there are several slots for both
# summer and winter time; the plan job lets a slot run only when its run is still missing (cache marker per key,
# scripts/github_beh.py plan). Mode in learning/provoz/github.json: "stin" commits nothing and has no hourly runs,
# "ostry" commits learning/ and refreshes every hour (the hourly slots then also cover the daily and Friday runs).
name: FXBOT denní běh a páteční signály

on:
  schedule:
    - cron: "5 20 * * 5"     # Friday 16:05 New York, summer time (EDT)
    - cron: "5 21 * * 5"     # Friday 16:05 New York, winter time (EST)
    - cron: "7 21 * * 1-5"   # 17:07 New York (EDT)
    - cron: "7 22 * * 1-5"   # 17:07 New York (EST)
    - cron: "41 23 * * 1-5"  # backup slot
    - cron: "23 3 * * 2-6"   # late backup slot (the previous New York evening)
    - cron: "12 * * * 1-5"   # hourly refresh, Monday 00:12 - Friday 23:12 UTC (runs only in the "ostry" mode, R-051)
  workflow_dispatch:
    inputs:
      vynutit:
        description: "Spustit, i když dnešní běh už proběhl"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

concurrency:
  group: fxbot-provoz
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bezet: ${{ steps.rozhodnuti.outputs.bezet }}
      druh: ${{ steps.rozhodnuti.outputs.druh }}
      denni: ${{ steps.klice.outputs.denni }}
      patek: ${{ steps.klice.outputs.patek }}
      hodina: ${{ steps.klice.outputs.hodina }}
      rezim: ${{ steps.klice.outputs.rezim }}
      denni_hotovo: ${{ steps.hotovo-denni.outputs.cache-hit }}
      patek_hotovo: ${{ steps.hotovo-patek.outputs.cache-hit }}
      hodina_hotovo: ${{ steps.hotovo-hodina.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/github_beh.py
            learning/provoz/github.json
          sparse-checkout-cone-mode: false
      - id: klice
        run: |
          python3 scripts/github_beh.py plan
          python3 scripts/github_beh.py rezim
      - id: hotovo-denni
        uses: actions/cache/restore@v6
        with:
          path: .znacka
          key: fxbot-beh-denni-${{ steps.klice.outputs.denni }}
          lookup-only: true
      - id: hotovo-patek
        if: steps.klice.outputs.patek != ''
        uses: actions/cache/restore@v6
        with:
          path: .znacka
          key: fxbot-beh-patek-${{ steps.klice.outputs.patek }}
          lookup-only: true
      - id: hotovo-hodina
        if: steps.klice.outputs.rezim == 'ostry'
        uses: actions/cache/restore@v6
        with:
          path: .znacka
          key: fxbot-beh-hodina-${{ steps.klice.outputs.hodina }}
          lookup-only: true
      - id: rozhodnuti
        env:
          VYNUTIT: ${{ github.event_name == 'workflow_dispatch' && inputs.vynutit }}
          REZIM: ${{ steps.klice.outputs.rezim }}
          DENNI_HOTOVO: ${{ steps.hotovo-denni.outputs.cache-hit }}
          PATEK: ${{ steps.klice.outputs.patek }}
          PATEK_HOTOVO: ${{ steps.hotovo-patek.outputs.cache-hit }}
          HODINA_HOTOVO: ${{ steps.hotovo-hodina.outputs.cache-hit }}
        run: |
          bezet=false; druh=hodina
          if [ "$REZIM" = "ostry" ] && [ "$HODINA_HOTOVO" != "true" ]; then bezet=true; fi
          if [ "$DENNI_HOTOVO" != "true" ]; then bezet=true; druh=denni; fi
          if [ -n "$PATEK" ] && [ "$PATEK_HOTOVO" != "true" ]; then bezet=true; druh=patek; fi
          if [ "$VYNUTIT" = "true" ]; then bezet=true; if [ "$druh" = "hodina" ]; then druh=denni; fi; fi
          echo "bezet=$bezet" >> "$GITHUB_OUTPUT"
          echo "druh=$druh" >> "$GITHUB_OUTPUT"
          echo "beh: $bezet ($druh, rezim $REZIM)"

  beh:
    needs: plan
    if: needs.plan.outputs.bezet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FXBOT_BEH_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FXBOT_STRANKA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      DRUH: ${{ needs.plan.outputs.druh }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-provoz.txt
      - run: pip install -r requirements-provoz.txt

      - name: Běh (sazby, signály, dopředný test, heuristiky, diagnostika)
        run: |
          mkdir -p zprava
          python scripts/rutina.py denni 2>&1 | tee zprava/beh.txt || { echo "druhý pokus za minutu"; sleep 60; python scripts/rutina.py denni 2>&1 | tee -a zprava/beh.txt; }

      - name: Souhrn
        if: always()
        run: mkdir -p zprava && python scripts/github_beh.py souhrn "$DRUH" | tee zprava/souhrn.md

      - name: Uložit do repozitáře (jen ostrý režim)
        if: needs.plan.outputs.rezim == 'ostry'
        run: |
          python scripts/github_beh.py zapis "$DRUH"
          git add learning/ docs/
          if git diff --cached --quiet; then echo "nic nového k uložení"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "GitHub: $DRUH $(date -u +'%F %H:%M') UTC" -m "Běh: $FXBOT_BEH_URL"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - name: Sestavit stránku
        run: python scripts/web_stranka.py --beh-url "$FXBOT_BEH_URL" --behy-url "${{ github.server_url }}/${{ github.repository }}/actions"

      - name: Kontrola stránky v prohlížeči
        run: |
          kontrola() { python scripts/web_stranka.py kontrola-prohlizec _site --dom zprava/stranka.html 2>&1 | tee -a zprava/kontrola.txt; }
          kontrola || { echo "Chrome nešel, instaluji Chromium"; python -m playwright install --with-deps chromium > /dev/null && kontrola; }

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Oznámení na telefon (jen když je nastavené téma ntfy)
        env:
          FXBOT_NTFY_TEMA: ${{ secrets.FXBOT_NTFY_TEMA }}
        run: python scripts/github_beh.py oznam "$DRUH"

      - name: Značka hotového běhu
        run: mkdir -p .znacka && date -u > .znacka/hotovo
      - if: needs.plan.outputs.denni_hotovo != 'true'
        uses: actions/cache/save@v6
        with:
          path: .znacka
          key: fxbot-beh-denni-${{ needs.plan.outputs.denni }}
      - if: needs.plan.outputs.patek != '' && needs.plan.outputs.patek_hotovo != 'true'
        uses: actions/cache/save@v6
        with:
          path: .znacka
          key: fxbot-beh-patek-${{ needs.plan.outputs.patek }}
      - if: needs.plan.outputs.rezim == 'ostry' && needs.plan.outputs.hodina_hotovo != 'true'
        uses: actions/cache/save@v6
        with:
          path: .znacka
          key: fxbot-beh-hodina-${{ needs.plan.outputs.hodina }}

      - name: Oznámení o selhání
        if: failure()
        env:
          FXBOT_NTFY_TEMA: ${{ secrets.FXBOT_NTFY_TEMA }}
        run: python scripts/github_beh.py oznam-chyba "$DRUH"

      - name: Zpráva o běhu (větev provoz-zprava)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p zprava
          cp -f data/live/diagnostika.json zprava/ 2>/dev/null || true
          { echo "beh: $FXBOT_BEH_URL"; echo "workflow: $GITHUB_WORKFLOW"; echo "druh: $DRUH"; echo "stav jobu: $JOB_STATUS"; date -u; } > zprava/README.txt
          cd zprava && git init -q && git checkout -q -b provoz-zprava && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Zpráva o běhu $GITHUB_RUN_ID ($DRUH, $JOB_STATUS)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" provoz-zprava || echo "zprávu se nepodařilo uložit"

  stranka:
    needs: [plan, beh]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - id: nasazeni
        uses: actions/deploy-pages@v5
      - name: Oznámení o selhání zveřejnění
        if: failure() && needs.plan.outputs.druh != 'hodina'
        env:
          FXBOT_NTFY_TEMA: ${{ secrets.FXBOT_NTFY_TEMA }}
          BEH: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$FXBOT_NTFY_TEMA" ] || exit 0
          python3 -c 'import json,os; print(json.dumps({"topic": os.environ["FXBOT_NTFY_TEMA"], "priority": 4, "title": "FXBOT: stránku se nepodařilo zveřejnit", "message": "Výpočet proběhl, ale nová verze stránky se nenasadila. " + os.environ["BEH"]}))' \
            | curl -s -o /dev/null -H "Content-Type: application/json" --data-binary @- https://ntfy.sh/ || true
